<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Reviewer</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-content">
      <h1>Code Reviewer</h1>
      <div class="header-actions">
        <input
          type="text"
          id="repoPath"
          placeholder="Enter local repository path..."
          value="">
        <button id="loadBtn" onclick="loadRepo()">Load Repository</button>
        <button id="submitReviewBtn" onclick="submitReview()" class="submit-btn hidden">
          Submit Review
        </button>
      </div>
    </div>
    <div id="status" class="status"></div>
  </header>

  <div class="main-container">
    <section id="picker" class="picker">
      <div class="picker-card">
        <h2>Open a repository</h2>

        <section id="recentSection" class="picker-section hidden">
          <h3>Recent</h3>
          <div id="recentList" class="picker-list"></div>
        </section>

        <section class="picker-section picker-browse">
          <h3>Browse</h3>
          <div class="picker-toolbar">
            <button id="browseUpBtn" class="picker-up" onclick="browseUp()">Up</button>
            <span id="browsePath" class="picker-current"></span>
            <button id="browseOpenBtn" class="picker-open hidden" onclick="openBrowsed()">
              Open this repository
            </button>
          </div>
          <div id="browseList" class="picker-list picker-list-scroll"></div>
        </section>
      </div>
    </section>

    <aside id="sidebar" class="sidebar hidden">
      <div class="sidebar-header">
        <h2>Changed Files</h2>
        <span id="fileCount" class="file-count"></span>
      </div>
      <div id="filesList" class="files-list"></div>
    </aside>

    <div id="resizeHandle" class="resize-handle hidden"></div>

    <main id="codeSection" class="code-section hidden">
      <div class="code-header">
        <h2 id="currentFile"></h2>
        <button class="full-context-btn" onclick="showFullContext()">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M1.75 2.5a.25.25 0 00-.25.25v10.5c0 .138.112.25.25.25h12.5a.25.25 0 00.25-.25V2.75a.25.25 0 00-.25-.25H1.75zM0 2.75C0 1.784.784 1 1.75 1h12.5c.966 0 1.75.784 1.75 1.75v10.5A1.75 1.75 0 0114.25 15H1.75A1.75 1.75 0 010 13.25V2.75zm9.22 3.72a.75.75 0 000 1.06L10.69 9 9.22 10.47a.75.75 0 101.06 1.06l2-2a.75.75 0 000-1.06l-2-2a.75.75 0 00-1.06 0zM6.78 6.47a.75.75 0 00-1.06 0l-2 2a.75.75 0 000 1.06l2 2a.75.75 0 001.06-1.06L5.31 9l1.47-1.47a.75.75 0 000-1.06z"></path>
          </svg>
          Full Context
        </button>
      </div>
      <div id="codeViewer" class="code-viewer"></div>
    </main>

    <div id="commentsResizeHandle" class="resize-handle hidden"></div>

    <aside id="commentsSidebar" class="comments-sidebar hidden">
      <div class="comments-sidebar-header">
        <h2>Comments</h2>
        <span id="commentsCount" class="comments-count">0</span>
      </div>
      <div id="commentsList" class="comments-list"></div>
    </aside>
  </div>

  <script src="app.js"></script>
</body>
</html>
