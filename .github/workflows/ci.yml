name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A job that cannot get a runner should fail in minutes. Without this the
    # run sits in the queue until GitHub cancels it six hours later, which
    # reads as a broken build and blocks every pull request behind it.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Windows was dropped in August 2026, when its jobs sat in the queue
        # for six hours without a runner. It came back once #91 made the suite
        # pass there and a probe run showed runners picking the jobs up. If
        # they stop again, the timeout above fails the leg in fifteen minutes
        # instead of blocking every pull request for six hours.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The suite drives real repositories, so it needs a usable git identity
      # even though the helper pins author and committer per command.
      - name: Configure git
        run: |
          git config --global init.defaultBranch main
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"

      # Electron is only needed to build the desktop app, not to run the tests.
      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Run tests
        run: npm test

  lockfile:
    name: lockfile resolves to the public registry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # A lockfile generated behind a corporate proxy pins every tarball to a
      # host nobody outside that network can reach, and leaks its name. This
      # has happened once already; it should never merge again.
      - name: Check for private registry URLs
        run: |
          if grep -nP '"resolved": "https?://(?!registry\.npmjs\.org/)' package-lock.json; then
            echo "::error::package-lock.json resolves packages outside registry.npmjs.org"
            exit 1
          fi
          echo "All resolved URLs point at registry.npmjs.org"
