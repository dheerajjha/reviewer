# Publishes to npm on a v* tag, via trusted publishing (OIDC).
#
# There is no npm token anywhere in this repository. npm verifies the workflow
# identity below and mints a short-lived credential for that one publish. The
# trust relationship is registered against the package:
#
#   npm trust list git-reviewer
#     type: github   file: release.yml   repository: dheerajjha/reviewer
#
# Three things must keep matching that record or the publish is rejected: the
# repository, this file's name, and the absence of an environment. Renaming
# this file is therefore a breaking change -- re-run `npm trust github` if you
# ever do.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Never publish something the suite has not seen. A tag is cheap to re-cut;
  # a published npm version can be deprecated but not replaced.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # this IS the credential: OIDC identity + provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # Node 22 ships npm 10.x, and trusted publishing needs >= 11.5.1. An
      # older npm does not error on the missing feature -- it falls back to
      # looking for a token, finds none, and fails with a bare 404/ENEEDAUTH
      # that says nothing about OIDC. Pin the floor explicitly and print it.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version
          node -e '
            const v = process.env.npm_version || require("child_process").execSync("npm --version").toString().trim();
            const [maj, min, pat] = v.split(".").map(Number);
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1)));
            if (!ok) { console.error(`::error::npm ${v} cannot use trusted publishing (need >= 11.5.1)`); process.exit(1); }
            console.log(`npm ${v} supports trusted publishing`);
          '

      - run: npm ci

      # The published tarball is built from the `files` allowlist, so a file
      # that exists in git but is not listed simply is not shipped, and the
      # failure only shows up as a runtime crash for whoever installed it.
      # Assert the entry point and every lib/ module made it in.
      - name: Verify the tarball ships what the CLI needs
        run: |
          npm pack --silent
          tar -tzf git-reviewer-*.tgz > /tmp/files.txt

          # Every lib/ module, derived from what is in the tree rather than
          # listed here. A hand-written list is the thing that goes stale: this
          # step was added with seven modules named in it and three more were
          # written before anyone looked at it again.
          for module in lib/*.js; do
            grep -qx "package/$module" /tmp/files.txt \
              || { echo "::error::$module missing from the tarball"; exit 1; }
          done

          # The entry points, which are named because they are named in
          # package.json and would not be found by a glob over lib/.
          for required in package/bin/reviewer.js package/server.js package/public/index.html package/public/app.js package/public/style.css; do
            grep -qx "$required" /tmp/files.txt || { echo "::error::$required missing from the tarball"; exit 1; }
          done

          echo "tarball contents verified ($(wc -l < /tmp/files.txt) entries, $(ls lib/*.js | wc -l) lib modules)"

      # Install the tarball into a clean prefix and run the real binary, so a
      # broken entry point cannot reach the registry.
      - name: Smoke-test the packed binary
        run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke && npm init -y --silent > /dev/null
          npm install --silent "$GITHUB_WORKSPACE"/git-reviewer-*.tgz
          ./node_modules/.bin/reviewer --version
          ./node_modules/.bin/reviewer --help | head -1

      # No NODE_AUTH_TOKEN: the id-token permission above is the credential.
      # Provenance is attested from the same OIDC identity.
      - run: npm publish --provenance --access public
